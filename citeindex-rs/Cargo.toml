[workspace]
resolver = "2"
members = ["crates/core", "crates/kernel", "crates/tui", "crates/plugins"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ajia <yyjfwoaini@gmail.com>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
ratatui = "0.29"
crossterm = "0.28"
pulldown-cmark = "0.12"
fuzzy-matcher = "0.3"
clap = { version = "4", features = ["derive"] }
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
tantivy = "0.22"
rusqlite = { version = "0.34", features = ["bundled"] }
regex = "1"
once_cell = "1"
