[project]
name = "citeagent"
version = "0.4.0"
description = "AI research agent for academic scholars — search, RAG chat, integrity verification, and citation management."
authors = [{ name = "ajia", email = "yyjfwoaini@gmail.com" }]
dependencies = [
  "citeindex>=0.12.0",
  "tantivy>=0.26.0",
  "mcp>=1.0.0",
  "dspy-ai>=2.6.27",
  "litellm>=1.83.0",
  "citeproc-py>=0.7.0",
  "jsonschema>=4.20.0",
  "pyyaml>=6.0.0",
  "python-dateutil>=2.8.0",
  "python-dotenv>=1.1.0",
  "setuptools>=80.9.0",
]
readme = "README.md"
requires-python = ">= 3.12"
license = "MIT"

[project.scripts]
citeagent = "citeagent.cli:main"

[build-system]
requires = ["hatchling==1.26.3", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = ["pytest>=7.0.0", "pytest-cov>=2.12.1"]

[tool.hatch.build.targets.wheel]
packages = ["citeagent"]